<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Apply theme before first paint so prerendered pages don't flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'light'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        // Mark JS active before first paint: entrance text is hidden until
        // splitText runs, so the prerendered raw text never flashes in then
        // out before the reveal. No-JS clients skip this and see real text.
        document.documentElement.classList.add('js-anim')
      })()
    </script>
    <!-- title, description, canonical, hreflang and og/twitter locale fields are
         localized per route by useHead (see App.vue) — kept out of the static
         template so the prerendered EN and RU pages don't carry duplicates. -->
    <meta name="author" content="Denis Sofonov" />
    <meta name="keywords" content="fullstack developer, lead frontend, senior frontend, vue, nuxt, react, typescript, node, python, php, moscow, fullstack разработчик, fullstack разработчик москва, frontend разработчик москва, vue разработчик, nuxt разработчик, react разработчик, веб-разработчик москва, денис софонов, софонов денис, денис софонов разработчик" />
    <meta name="geo.region" content="RU-MOW" />
    <meta name="geo.placename" content="Moscow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sofonov.dev" />
    <meta property="og:image" content="https://sofonov.dev/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="denis sofonov — fullstack developer, moscow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sofonov.dev/og.svg" />

    <!-- Favicon — real hosted files. Google does NOT index data:-URI favicons,
         which is why the SERP icon was blank; a crawlable URL is required. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

    <!-- Fonts: preconnect + preload critical weights actually used above the fold -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;700&display=swap"
    />

    <!-- JSON-LD: Person schema for rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Denis Sofonov",
        "alternateName": ["Денис Софонов", "Софонов Денис", "denis sofonov", "sofonov denis", "денис софонов", "софонов денис"],
        "url": "https://sofonov.dev/",
        "image": "https://sofonov.dev/og.svg",
        "jobTitle": ["Senior Frontend Developer", "Fullstack Developer", "Fullstack-разработчик", "Lead Frontend Developer"],
        "description": "Lead frontend developer going fullstack — architecting products end to end with Vue, Nuxt, React and Node, and growing across the backend with Python and PHP.",
        "email": "mailto:denissofonovv@gmail.com",
        "knowsLanguage": ["ru", "en"],
        "seeks": {
          "@type": "Demand",
          "name": "Fullstack / Senior Frontend role — remote, hybrid or relocation"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Moscow",
          "addressCountry": "RU"
        },
        "knowsAbout": [
          "Vue 3", "Nuxt", "React", "TypeScript", "Node.js", "Python",
          "PHP", "Laravel", "FastAPI", "PostgreSQL", "Clean Architecture", "Web Performance"
        ],
        "sameAs": [
          "https://t.me/denis_sofonov",
          "https://github.com/denis-sofonov"
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
