name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install (not ci): the lockfile carries platform/npm-version-specific
      # optional native deps (emnapi/wasm fallbacks) that trip ci's strict check
      # across npm versions. install reconciles them and stays reproducible enough
      # for a static build.
      - run: npm install --no-audit --no-fund
      - run: npm run build

      # Deploy via FTP to Reg.ru
      - name: Deploy to Reg.ru
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /www/sofonov.dev/
